# Chui Protocol Sui 合約套件
[package]
name = "chui"
edition = "2024.beta"
version = "0.1.0"

# 新版 sui CLI（1.45+）會自動注入 Sui framework 相依；
# 為了相容較舊版本仍明確宣告。
[dependencies]
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "framework/testnet" }

[addresses]
chui = "0x0"
